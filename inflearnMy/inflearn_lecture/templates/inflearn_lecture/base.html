<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>인프런</title>

    <!-- CSS only -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous" />
    <script src="https://code.jquery.com/jquery-3.6.0.js" integrity="sha256-H+K7U5CnXl1h5ywQfKtSj8PCmoN9aaq30gDh27Xc0jk=" crossorigin="anonymous"></script>
    {% load static %}
    <link rel="stylesheet" href="{% static 'styles/style.css'%}?after" />
  </head>
  <body>
    <div class="base-header container">
      <div class="base-left">
        <a href="/">
          <h1>인프런</h1>
        </a>
        <ul>
          <li>
            <a href="/lecture_list"> 강의목록 </a>
          </li>
          <li>메뉴2</li>
          <li>메뉴3</li>
          <li>메뉴4</li>
          <li>메뉴5</li>
        </ul>
      </div>
      <div class="base-right">
        {% if user.is_authenticated %}
        <ul>
          <li>
            <a href="/signout"> 로그아웃 </a>
          </li>
        </ul>
        {% else %}
        <ul>
          <li>
            <a href="/signin"> 로그인 </a>
          </li>
          <li>
            <a href="/signup"> 회원가입 </a>
          </li>
        </ul>
        {% endif %}
      </div>
    </div>
    <div class="base-main container">{% block content %} {% endblock %}</div>
    <div class="base-footer container">@morethanmin</div>
    <!-- JavaScript Bundle with Popper -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM" crossorigin="anonymous"></script>
  </body>
</html>
